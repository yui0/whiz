<!doctype html>
<html>
<head><title>Whiz Input</title></head>
<body>
  <div id="panel">
    <div id="header">
      <div id="mode_badge">あ</div>
      <div id="reading">日本語入力</div>
      <div id="status">WHIZ</div>
    </div>
    <div id="rule"></div>
    <div id="candidates">
      <div id="cand0" class="candidate selected"><div id="num0" class="number">1</div><div id="word0" class="word"></div></div>
      <div id="cand1" class="candidate"><div id="num1" class="number">2</div><div id="word1" class="word"></div></div>
      <div id="cand2" class="candidate"><div id="num2" class="number">3</div><div id="word2" class="word"></div></div>
      <div id="cand3" class="candidate"><div id="num3" class="number">4</div><div id="word3" class="word"></div></div>
      <div id="cand4" class="candidate"><div id="num4" class="number">5</div><div id="word4" class="word"></div></div>
      <div id="cand5" class="candidate"><div id="num5" class="number">6</div><div id="word5" class="word"></div></div>
      <div id="cand6" class="candidate"><div id="num6" class="number">7</div><div id="word6" class="word"></div></div>
      <div id="cand7" class="candidate"><div id="num7" class="number">8</div><div id="word7" class="word"></div></div>
      <div id="cand8" class="candidate"><div id="num8" class="number">9</div><div id="word8" class="word"></div></div>
      <div id="cand9" class="candidate"><div id="num9" class="number">0</div><div id="word9" class="word"></div></div>
    </div>
    <div id="empty">ローマ字を入力すると候補を表示します</div>
    <div id="message"></div>
    <div id="footer">
      <div id="hint_primary">Tab 候補  ←→ 文節  S+←→ 境界</div>
      <div id="page">1 / 1</div>
    </div>
  </div>
</body>
</html>
